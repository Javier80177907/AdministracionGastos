<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar movimiento · Bolsillo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>

  <main class="card">

    <header class="card__header">
      <span class="card__eyebrow">Bolsillo</span>
      <h1 class="card__title">¿Qué movió tu plata hoy?</h1>
      <p class="card__subtitle">Registra el monto, la categoría y la fecha en segundos.</p>
    </header>

    <form class="form" action="#" method="post">

      <div class="field field--amount">
        <label for="monto">Monto</label>
        <div class="amount-input">
          <span class="amount-input__prefix">$</span>
          <input type="number" id="monto" name="monto" placeholder="0" inputmode="decimal" min="0" step="1000">
          <span class="amount-input__suffix">COP</span>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="categoria">Categoría</label>
          <select id="categoria" name="categoria">
            <option value="" selected disabled>Elige una</option>
            <option value="comida">Comida</option>
            <option value="transporte">Transporte</option>
            <option value="estudio">Estudio</option>
            <option value="salidas">Salidas</option>
            <option value="suscripciones">Suscripciones</option>
            <option value="hogar">Hogar</option>
            <option value="salario">Salario</option>
            <option value="otro">Otro</option>
          </select>
        </div>

        <div class="field">
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" name="fecha">
        </div>
      </div>

      <div class="tipo">
        <span class="tipo__label">Tipo de movimiento</span>

        <div class="tipo__grid">
          <button type="button" class="tipo__btn tipo__btn--ingreso">
            <span class="tipo__icon">＋</span>
            Ingreso
          </button>

          <button type="button" class="tipo__btn tipo__btn--gasto">
            <span class="tipo__icon">－</span>
            Gasto
          </button>
        </div>
      </div>

      <button type="submit" class="submit-btn">Guardar movimiento</button>

    </form>

  </main>

</body>
</html>

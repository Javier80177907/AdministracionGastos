<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta · Bolsillo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>

  <main class="card">

    <header class="card__header">
      <span class="card__eyebrow">Bolsillo</span>
      <h1 class="card__title">Empecemos a organizar tu plata</h1>
      <p class="card__subtitle">Crea tu cuenta en menos de un minuto.</p>
    </header>

    <form class="form" action="#" method="post">

      <div class="field">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
      </div>

      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <div class="field">
          <label for="confirmar">Confirmar contraseña</label>
          <input type="password" id="confirmar" name="confirmar" placeholder="••••••••" required>
        </div>
      </div>

      <label class="checkbox checkbox--terms">
        <input type="checkbox" id="terminos" name="terminos" required>
        <span>Acepto los términos y condiciones</span>
      </label>

      <button type="submit" class="submit-btn">Crear cuenta</button>

      <p class="form__footer">
        ¿Ya tienes cuenta? <a href="login.html" class="link-strong">Inicia sesión</a>
      </p>

    </form>

  </main>

</body>
</html>

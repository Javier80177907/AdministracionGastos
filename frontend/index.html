<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión · Bolsillo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>

  <main class="card">

    <header class="card__header">
      <span class="card__eyebrow">Bolsillo</span>
      <h1 class="card__title">Qué gusto verte de nuevo</h1>
      <p class="card__subtitle">Inicia sesión para seguir el rastro de tu plata.</p>
    </header>

    <form class="form" action="#" method="post">

      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <div class="form__extra">
        <label class="checkbox">
          <input type="checkbox" id="recordar" name="recordar">
          <span>Recordarme</span>
        </label>
        <a href="#" class="link-muted">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="submit-btn">Iniciar sesión</button>

      <p class="form__footer">
        ¿Aún no tienes cuenta? <a href="registro.html" class="link-strong">Regístrate</a>
      </p>

    </form>

  </main>

  <script>
    document.querySelector('.form').addEventListener('submit', function (e) {
      e.preventDefault();
      // OJO SOLO DE PRUEBA CAMIAR AL CONECTAR BASE 
       // OJO SOLO DE PRUEBA CAMIAR AL CONECTAR BASE 
       // OJO SOLO DE PRUEBA CAMIAR AL CONECTAR BASE 
       // OJO SOLO DE PRUEBA CAMIAR AL CONECTAR BASE 
      window.location.href = 'registrarmovi.html';

      
    });
  </script>

</body>
</html>
